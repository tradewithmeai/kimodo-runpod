<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>linel — text to motion</title>
<style>
  :root {
    --bg:#0e1113; --panel:#171b1f; --line:#272d33;
    --text:#e6eaed; --muted:#8b969f; --accent:#5ac8fa; --warn:#ffb35a; --err:#ff8080;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--text); overflow:hidden;
    font:14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #stage { position:fixed; inset:0; }

  .panel {
    position:fixed; background:color-mix(in srgb, var(--panel) 92%, transparent);
    border:1px solid var(--line); border-radius:10px; backdrop-filter:blur(8px); z-index:10;
  }
  #controls { top:16px; left:16px; width:340px; max-width:calc(100vw - 32px); padding:14px; }
  #account  { top:16px; right:16px; width:240px; padding:12px; }
  #history  { bottom:16px; right:16px; width:240px; padding:12px; max-height:40vh; overflow:auto; }

  h1 { font-size:13px; margin:0 0 10px; letter-spacing:.08em; text-transform:uppercase;
       color:var(--muted); font-weight:600; }
  textarea,input,button,select {
    font:inherit; color:var(--text); background:#0f1316;
    border:1px solid var(--line); border-radius:6px; padding:8px 10px; width:100%;
  }
  textarea { resize:vertical; min-height:60px; }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row > label { flex:1; font-size:12px; color:var(--muted); }
  .row input { margin-top:3px; }
  button { margin-top:10px; cursor:pointer; background:var(--accent); color:#04222e;
           border:none; font-weight:600; padding:10px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line);
                 font-weight:500; }
  #status { margin-top:10px; font-size:12px; color:var(--muted); min-height:1.5em; }
  #status.err { color:var(--err); }
  #status.warn { color:var(--warn); }
  #examples { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  #examples button { margin:0; width:auto; padding:4px 9px; font-size:12px;
                     background:#1d2429; color:var(--muted); font-weight:500; }
  #examples button:hover { color:var(--text); }

  .credits { font-size:22px; font-variant-numeric:tabular-nums; }
  .who { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis;
         white-space:nowrap; }
  .jobrow { display:flex; justify-content:space-between; gap:8px; padding:5px 0;
            border-bottom:1px solid var(--line); font-size:12px; cursor:pointer; }
  .jobrow:last-child { border-bottom:none; }
  .jobrow:hover .jp { color:var(--text); }
  .jp { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .js { flex:none; font-variant-numeric:tabular-nums; }
  .js.done{color:var(--accent);} .js.failed{color:var(--err);}
  .js.running,.js.queued{color:var(--warn);}

  #transport { bottom:16px; left:50%; transform:translateX(-50%); padding:10px 14px;
               display:none; align-items:center; gap:12px; max-width:calc(100vw - 32px); }
  #transport.on { display:flex; }
  #scrub { width:260px; }
  #frameno { font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px;
             min-width:74px; }
  #transport button { margin:0; width:auto; padding:6px 12px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="stage"></div>

<div id="controls" class="panel">
  <h1>Text → Motion</h1>
  <textarea id="prompt" placeholder="a person walks forward and waves">a person walks forward and waves</textarea>
  <div class="row">
    <label>Seconds <input id="seconds" type="number" value="6" min="1" max="9.8" step="0.5"></label>
    <label>Guidance <input id="guidance" type="number" value="2.5" min="1" max="10" step="0.5"></label>
  </div>
  <button id="go">Generate</button>
  <div id="examples"></div>
  <div id="status">Loading…</div>
</div>

<div id="account" class="panel">
  <h1>Account</h1>
  <div id="signedOut">
    <div class="who" style="margin-bottom:8px">Sign in to generate.</div>
    <div id="googleBtn"></div>
    <div id="devBox" class="hidden">
      <input id="devUser" placeholder="dev username" value="dev">
      <button id="devLogin" class="ghost">Dev sign in</button>
    </div>
  </div>
  <div id="signedIn" class="hidden">
    <div class="who" id="who"></div>
    <div class="credits"><span id="credits">–</span> <span style="font-size:12px;color:var(--muted)">credits</span></div>
    <button id="logout" class="ghost">Sign out</button>
  </div>
</div>

<div id="history" class="panel hidden">
  <h1>Recent</h1>
  <div id="jobs"></div>
</div>

<div id="transport" class="panel">
  <button id="play" class="ghost">Pause</button>
  <input id="scrub" type="range" min="0" max="0" value="0">
  <span id="frameno">0 / 0</span>
</div>

<!--
  Google Identity Services must be loaded from Google's origin and cannot carry an
  SRI hash: Google rotates this file and explicitly documents it as unpinnable.
  This is the one external script we accept; it is required for sign-in.
-->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!--
  three.js is vendored locally rather than pulled from a CDN. For a service handling
  auth and payments, a third-party script in the page is a supply-chain risk, and
  importmap entries cannot carry SRI hashes anyway. Self-hosting removes the problem
  entirely and makes the app work without external network access.
  Pinned: three 0.160.0
-->
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/three.module.js",
  "three/addons/": "/vendor/three/addons/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const setStatus = (msg, cls = '') => { statusEl.textContent = msg; statusEl.className = cls; };

// ---------------------------------------------------------------- 3D scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1113);
scene.fog = new THREE.Fog(0x0e1113, 8, 26);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(3.2, 1.9, 4.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
$('stage').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x20262b, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(4, 8, 5);
scene.add(key);
scene.add(new THREE.GridHelper(40, 40, 0x35414a, 0x1e252b));

// Skeleton is rebuilt per clip: joint count and chains arrive with the motion, so a
// future 31-joint model needs no viewer change.
let motion = null, jointMeshes = [], boneLines = [];
const skeleton = new THREE.Group();
scene.add(skeleton);
const CHAIN_COLORS = [0x5ac8fa, 0x5ac8fa, 0xe6eaed, 0xffb35a, 0xffb35a];

function buildSkeleton(data) {
  skeleton.clear(); jointMeshes = []; boneLines = [];
  const geo = new THREE.SphereGeometry(0.028, 12, 12);
  const mat = new THREE.MeshStandardMaterial({ color: 0xe6eaed, roughness: 0.5 });
  for (let j = 0; j < data.joints[0].length; j++) {
    const m = new THREE.Mesh(geo, mat); skeleton.add(m); jointMeshes.push(m);
  }
  (data.chains || []).forEach((chain, ci) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(chain.length * 3), 3));
    const line = new THREE.Line(g, new THREE.LineBasicMaterial({
      color: CHAIN_COLORS[ci % CHAIN_COLORS.length] }));
    line.frustumCulled = false; skeleton.add(line); boneLines.push({ line, chain });
  });
}

function applyFrame(f) {
  if (!motion) return;
  const pose = motion.joints[f];
  for (let j = 0; j < pose.length; j++) jointMeshes[j].position.set(...pose[j]);
  for (const { line, chain } of boneLines) {
    const arr = line.geometry.attributes.position.array;
    chain.forEach((j, i) => { arr[i*3] = pose[j][0]; arr[i*3+1] = pose[j][1]; arr[i*3+2] = pose[j][2]; });
    line.geometry.attributes.position.needsUpdate = true;
    line.geometry.computeBoundingSphere();
  }
}

// ---------------------------------------------------------------- playback
const transport = $('transport'), scrub = $('scrub'), frameno = $('frameno'), playBtn = $('play');
let playing = true, frame = 0, acc = 0, last = performance.now();

playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; };
scrub.oninput = () => { playing = false; playBtn.textContent = 'Play'; frame = +scrub.value;
                        applyFrame(frame); updateCounter(); };
const updateCounter = () => frameno.textContent = `${frame + 1} / ${motion ? motion.frames : 0}`;

function tick(now) {
  requestAnimationFrame(tick);
  const dt = (now - last) / 1000; last = now;
  if (motion && playing) {
    acc += dt; const step = 1 / motion.fps;
    while (acc >= step) {
      acc -= step; frame = (frame + 1) % motion.frames;
      applyFrame(frame); scrub.value = frame; updateCounter();
    }
  }
  controls.update(); renderer.render(scene, camera);
}
requestAnimationFrame(tick);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- api
const api = async (path, opts = {}) => {
  const r = await fetch(path, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!r.ok) {
    let detail = `${r.status}`;
    try { detail = (await r.json()).detail ?? detail; } catch {}
    throw new Error(detail);
  }
  return r.json();
};

let me = null;

function renderAccount() {
  const inEl = $('signedIn'), outEl = $('signedOut');
  if (me?.user) {
    inEl.classList.remove('hidden'); outEl.classList.add('hidden');
    $('who').textContent = me.user.name || me.user.email;
    $('credits').textContent = me.user.credits;
    $('history').classList.remove('hidden');
    refreshJobs();
  } else {
    inEl.classList.add('hidden'); outEl.classList.remove('hidden');
    $('history').classList.add('hidden');
    if (me?.dev_login) $('devBox').classList.remove('hidden');
  }
  $('go').disabled = !me?.user;
}

async function loadMe() {
  me = await api('/api/me');
  renderAccount();
  if (me.google_client_id && window.google) {
    google.accounts.id.initialize({
      client_id: me.google_client_id,
      callback: async (resp) => {
        try {
          await api('/api/auth/google', { method: 'POST',
            body: JSON.stringify({ credential: resp.credential }) });
          await loadMe(); setStatus('Signed in.');
        } catch (e) { setStatus(e.message, 'err'); }
      },
    });
    google.accounts.id.renderButton($('googleBtn'),
      { theme: 'filled_black', size: 'large', width: 216 });
  }
}

$('devLogin').onclick = async () => {
  try {
    await api('/api/auth/dev', { method: 'POST',
      body: JSON.stringify({ username: $('devUser').value }) });
    await loadMe(); setStatus('Signed in (dev).');
  } catch (e) { setStatus(e.message, 'err'); }
};

$('logout').onclick = async () => {
  await api('/api/auth/logout', { method: 'POST' });
  me = null; await loadMe(); setStatus('Signed out.');
};

// ---------------------------------------------------------------- jobs
async function refreshJobs() {
  try {
    const { jobs } = await api('/api/jobs');
    $('jobs').innerHTML = jobs.map(j => `
      <div class="jobrow" data-id="${j.job_id}" data-status="${j.status}">
        <span class="jp">${j.prompt.replace(/</g, '&lt;').slice(0, 34)}</span>
        <span class="js ${j.status}">${j.status === 'done' ? (j.duration_s + 's') : j.status}</span>
      </div>`).join('') || '<div class="who">No generations yet.</div>';
    document.querySelectorAll('.jobrow').forEach(el => {
      el.onclick = () => { if (el.dataset.status === 'done') loadMotion(el.dataset.id); };
    });
  } catch {}
}

async function loadMotion(jobId) {
  const data = await api(`/api/jobs/${jobId}/motion`);
  motion = data; buildSkeleton(data);
  frame = 0; scrub.max = data.frames - 1; scrub.value = 0;
  applyFrame(0); updateCounter();
  transport.classList.add('on'); playing = true; playBtn.textContent = 'Pause';
  setStatus(`${data.frames} frames @ ${data.fps}fps — generated in ${data.generated_in_s}s`);
}

async function generate() {
  const prompt = $('prompt').value.trim();
  if (!prompt || !me?.user) return;
  $('go').disabled = true;
  setStatus('Queued…', 'warn');
  try {
    const { job_id, credits } = await api('/api/jobs', { method: 'POST',
      body: JSON.stringify({
        prompt,
        seconds: +$('seconds').value,
        guidance: +$('guidance').value,
      }) });
    $('credits').textContent = credits;
    await pollJob(job_id);
  } catch (e) {
    setStatus(e.message, 'err');
  } finally {
    $('go').disabled = !me?.user;
    refreshJobs();
  }
}

async function pollJob(jobId) {
  const started = Date.now();
  while (Date.now() - started < 300000) {          // 5 min ceiling
    const j = await api(`/api/jobs/${jobId}`);
    if (j.status === 'done') { await loadMotion(jobId); return; }
    if (j.status === 'failed') { setStatus(`Failed: ${j.error}`, 'err'); return; }
    setStatus(j.status === 'running' ? 'Generating…' : 'Waiting in queue…', 'warn');
    await new Promise(r => setTimeout(r, 700));
  }
  setStatus('Timed out waiting for the job.', 'err');
}

$('go').onclick = generate;

const EXAMPLES = [
  'a person walks forward and waves',
  'a person jumps over an obstacle',
  'a person sits down on a chair',
  'a person runs in a circle',
  'a person throws a ball',
];
EXAMPLES.forEach(ex => {
  const b = document.createElement('button');
  b.textContent = ex;
  b.onclick = () => { $('prompt').value = ex; generate(); };
  $('examples').appendChild(b);
});

// ---------------------------------------------------------------- boot
(async () => {
  try {
    await loadMe();
    const h = await api('/health');
    setStatus(h.model_loaded ? 'Ready.'
      : h.load_error ? `Model error: ${h.load_error}` : 'Model is loading…',
      h.load_error ? 'err' : '');
  } catch (e) { setStatus(`Cannot reach server: ${e.message}`, 'err'); }
})();
</script>
</body>
</html>
